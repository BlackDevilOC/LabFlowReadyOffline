<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabFlow Server Manager - Setup Config</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .setup-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-back {
            display: block;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            margin-top: 16px;
        }

        #alert-box {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); }
        .alert-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); }
    </style>
</head>
<body>

    <div class="setup-container">
        <div class="header">
            <h1>⚙️ Local Database & Server Setup</h1>
            <p style="font-size: 13px; color: var(--text-muted);">Configure local PostgreSQL settings for your Server PC.</p>
        </div>

        <div id="alert-box"></div>

        <form id="config-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Local DB Host IP</label>
                    <input type="text" name="db_host" value="{{ config.LOCAL_DB_HOST or '127.0.0.1' }}" required>
                </div>
                <div class="form-group">
                    <label>DB Port</label>
                    <input type="number" name="db_port" value="{{ config.LOCAL_DB_PORT or 5432 }}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Database Name</label>
                <input type="text" name="db_name" value="{{ config.LOCAL_DB_NAME or 'labflow_db' }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>DB Username</label>
                    <input type="text" name="db_user" value="{{ config.LOCAL_DB_USER or 'postgres' }}" required>
                </div>
                <div class="form-group">
                    <label>DB Password</label>
                    <input type="password" name="db_pass" value="{{ config.LOCAL_DB_PASS or 'postgres' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Server Engine Port (LAN Access)</label>
                <input type="number" name="server_port" value="{{ config.SERVER_PORT or 8000 }}" required>
            </div>

            <button type="submit" class="btn-submit" id="save-btn">⚡ Test Connection & Save Config</button>
        </form>

        <a href="/" class="btn-back">← Back to Dashboard</a>
    </div>

    <script>
        document.getElementById('config-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const alertBox = document.getElementById('alert-box');
            
            btn.disabled = true;
            btn.innerText = 'Testing PostgreSQL Connection...';
            alertBox.style.display = 'none';

            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/save-config', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                alertBox.style.display = 'block';
                if (data.success) {
                    alertBox.className = 'alert-success';
                    alertBox.innerText = '✅ Connection Successful! Config saved to labflow_config.json and database tables initialized.';
                } else {
                    alertBox.className = 'alert-danger';
                    alertBox.innerText = '❌ ' + data.message;
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert-danger';
                alertBox.innerText = '❌ Failed to communicate with Admin Panel API.';
            } finally {
                btn.disabled = false;
                btn.innerText = '⚡ Test Connection & Save Config';
            }
        });
    </script>
</body>
</html>
