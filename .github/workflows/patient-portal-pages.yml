name: Deploy patient portal to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "labflow-portal/**"
      - ".github/workflows/patient-portal-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "labflow-portal-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: labflow-portal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
